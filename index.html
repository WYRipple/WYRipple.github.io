<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>张文源 | Academic Homepage</title>
  <link rel="icon" type="image/png" href="assets/icons/favicon.png" />
  <style>
    :root {
      --bg: #ffffff;
      --text: #222;
      --muted: #666;
      --line: #e8e8e8;
      --soft: #f7f7f7;
      --accent: #1f4fa3;
      --max-width: 1220px;
      --sidebar-width: 280px;
    }
    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      margin: 0;
      font-family: "Avenir Next", "Helvetica Neue", Helvetica, Arial, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.7;
    }
    a { color: var(--accent); text-decoration: none; }
    a:hover { text-decoration: underline; }

    .topbar {
      position: sticky;
      top: 0;
      z-index: 100;
      background: rgba(255,255,255,0.94);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid var(--line);
    }
    .topbar-inner {
      max-width: var(--max-width);
      margin: 0 auto;
      padding: 0 24px;
      min-height: 62px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
    }
    .nav {
      display: flex;
      gap: 28px;
      flex-wrap: wrap;
      align-items: center;
    }
    .nav-brand {
      color: #222;
      font-size: 15px;
      font-weight: 800;
      margin-right: 22px;
    }
    .nav a {
      color: #555;
      font-size: 14px;
      font-weight: 500;
    }
    .lang-toggle {
      border: none;
      background: transparent;
      color: #333;
      padding: 0;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
    }

    .page {
      max-width: var(--max-width);
      margin: 0 auto;
      padding: 28px 24px 60px;
      display: grid;
      grid-template-columns: var(--sidebar-width) minmax(0, 1fr);
      gap: 42px;
    }
    .sidebar {
      position: sticky;
      top: 92px;
      align-self: start;
    }
    .avatar {
      width: 120px;
      height: 120px;
      border-radius: 50%;
      object-fit: cover;
      display: block;
      margin-bottom: 18px;
      border: 1px solid var(--line);
      background: var(--soft);
    }
    .name {
      font-size: 26px;
      font-weight: 650;
      line-height: 1.2;
      margin-bottom: 8px;
    }
    .org, .bio {
      color: var(--muted);
      font-size: 15px;
      margin-bottom: 8px;
    }
    .sidebar-links {
      margin-top: 18px;
      display: grid;
      gap: 10px;
    }
    .sidebar-links a, .sidebar-links span {
      color: #333;
      font-size: 15px;
      word-break: break-word;
      font-weight: 600;
    }
    .sidebar-links a {
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }
    .location-item {
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }
    .contact-icon {
      width: 16px;
      height: 16px;
      object-fit: contain;
      display: inline-block;
    }

    .content section {
      scroll-margin-top: 84px;
      margin-bottom: 34px;
    }
    .section-title {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 24px;
      font-weight: 600;
      letter-spacing: -0.02em;
      margin: 4px 0 16px;
      line-height: 1.2;
      color: #3f444a;
    }
    .section-icon {
      font-size: 22px;
      line-height: 1;
      transform: translateY(-1px);
    }
    .subsection-title {
      font-size: 21px;
      font-weight: 600;
      letter-spacing: -0.01em;
      margin: 26px 0 14px;
      padding-top: 4px;
      border-top: 1px solid var(--line);
      color: #444b52;
    }
    .lead {
      color: var(--muted);
      font-size: 16px;
      margin-bottom: 8px;
    }

    .news-list, .award-list, .internship-list, .coauthor-list {
      margin: 0;
      padding-left: 20px;
    }
    .news-list li, .award-list li, .internship-list li, .coauthor-list li {
      margin: 8px 0;
    }

    .featured-grid {
      display: grid;
      gap: 30px;
    }
    .paper-card {
      display: grid;
      grid-template-columns: 45% minmax(0, 1fr);
      gap: 26px;
      align-items: start;
    }
    .paper-figure {
      position: relative;
      width: 100%;
      align-self: start;
    }
    .paper-thumb {
      width: 100%;
      height: auto;
      display: block;
      object-fit: contain;
      border: none;
      border-radius: 0;
      background: var(--soft);
      box-shadow: 0 8px 22px rgba(0,0,0,0.18);
    }
    .paper-badge {
      position: absolute;
      top: 12px;
      left: -10px;
      display: inline-block;
      padding: 3px 10px;
      border-radius: 0;
      background: #153b9b;
      color: #fff;
      font-size: 12px;
      line-height: 1.1;
      font-weight: 400;
      letter-spacing: 0.01em;
      text-transform: none;
      z-index: 2;
    }
    .paper-title {
      margin: 0 0 6px;
      font-size: 16px;
      line-height: 1.45;
      font-weight: 600;
      color: #4b5056;
    }
    .paper-authors {
      margin: 0 0 10px;
      font-size: 15px;
      line-height: 1.45;
      color: #60656b;
    }
    .paper-desc {
      margin-bottom: 10px;
      color: #555;
      font-size: 15px;
    }
    .paper-links {
      font-size: 15px;
      color: #666;
      line-height: 1.6;
    }
    .paper-links a, .paper-links button.link-btn {
      color: var(--accent);
      background: none;
      border: none;
      padding: 0;
      margin: 0;
      font: inherit;
      cursor: pointer;
      text-decoration: none;
    }
    .paper-links a:hover, .paper-links button.link-btn:hover {
      text-decoration: underline;
    }
    .paper-links .sep {
      color: #999;
      margin: 0 6px;
    }
    .bibtex {
      display: none;
      white-space: pre-wrap;
      word-break: break-word;
      margin-top: 10px;
      padding: 12px 14px;
      border-radius: 0;
      background: #fbfbfc;
      border-left: 3px solid #d7dce3;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 13px;
      line-height: 1.6;
      color: #333;
    }
    .paper-card.show-bibtex .bibtex { display: block; }

    .coauthor-list {
      list-style: disc;
      padding-left: 24px;
    }
    .coauthor-list li {
      padding: 6px 0 8px;
      border-bottom: none;
    }
    .coauthor-line1 {
      display: block;
      white-space: normal;
      overflow: visible;
      line-height: 1.45;
    }
    .venue-badge {
      display: inline-block;
      padding: 1px 7px;
      border-radius: 0;
      background: #153b9b;
      color: #fff;
      font-size: 11px;
      line-height: 1.1;
      font-weight: 400;
      letter-spacing: 0.01em;
      text-transform: uppercase;
      white-space: nowrap;
      vertical-align: baseline;
      margin-right: 4px;
    }
    .coauthor-link {
      display: inline-block;
      color: #6a7178;
      font-size: 12px;
      text-decoration: none;
      margin: 0 4px 0 0;
      line-height: 1;
      vertical-align: baseline;
    }
    .coauthor-link:hover {
      color: #153b9b;
      text-decoration: none;
    }
    .coauthor-title {
      font-weight: 600;
      color: #4b5056;
      font-size: 15px;
      line-height: 1.35;
    }
    .coauthor-authors {
      margin-top: 0;
      color: #60656b;
      font-size: 14px;
      line-height: 1.35;
      display: inline;
      white-space: normal;
    }
    .author-self {
      font-weight: 700;
      font-style: italic;
      color: #353a40;
    }
    .footer {
      color: #888;
      font-size: 13px;
      padding-top: 8px;
      border-top: 1px solid var(--line);
      margin-top: 24px;
    }

    @media (max-width: 980px) {
      .page {
        grid-template-columns: 1fr;
        gap: 28px;
      }
      .sidebar {
        position: static;
      }
      .paper-card {
        grid-template-columns: 1fr;
      }
    }
    @media (max-width: 720px) {
      .topbar-inner {
        align-items: flex-start;
        padding-top: 12px;
        padding-bottom: 12px;
      }
      .nav {
        gap: 12px;
      }
      .nav a {
        font-size: 13px;
      }
      .section-title {
        font-size: 26px;
      }
      .subsection-title {
        font-size: 20px;
      }
      .name {
        font-size: 26px;
      }
    }
  </style>
</head>

    let currentLang = 'zh';

    function highlightSelfName(text) {
      return text.replaceAll('Wenyuan Zhang', '<span class="author-self">Wenyuan Zhang</span>');
    }

    function escapeHtml(text) {
      return text
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
    }

    function createNav() {
      const nav = document.getElementById('nav');
      const brand = '<a href="#home" class="nav-brand">Homepage</a>';
      const items = siteData.nav[currentLang].map(item => `<a href="#${item.id}">${item.label}</a>`).join('');
      nav.innerHTML = brand + items;
    }

    function renderProfile() {
      const profile = siteData.profile[currentLang];
      document.getElementById('profileName').textContent = profile.name;
      document.getElementById('profileOrg').textContent = profile.org;
      document.getElementById('profileBio').textContent = profile.bio;

      const links = [
        `<span class="location-item">
            <img src="${profile.locationIcon}" alt="location" class="contact-icon" />
            <span>${profile.location}</span>
        </span>`
        ].concat(
        siteData.contacts[currentLang].map(item =>
            `<a href="${item.href}" target="_blank" rel="noreferrer">
            <img src="${item.icon}" alt="${item.label}" class="contact-icon" />
            <span>${item.label}</span>
            </a>`
        )
      );
      document.getElementById('sidebarLinks').innerHTML = links.join('');
    }

    function renderStaticText() {
      const text = siteData.text[currentLang];
      document.getElementById('homeLead').innerHTML = text.homeLead;
      document.getElementById('newsTitle').textContent = text.newsTitle;
      document.getElementById('publicationsTitle').textContent = text.publicationsTitle;
      document.getElementById('featuredPublishedTitle').textContent = text.featuredPublishedTitle;
      document.getElementById('featuredPreprintTitle').textContent = text.featuredPreprintTitle;
      document.getElementById('coauthorTitle').textContent = text.coauthorTitle;
      document.getElementById('awardsTitle').textContent = text.awardsTitle;
      document.getElementById('footerText').textContent = text.footerText;
    }

    function renderNews() {
      document.getElementById('newsList').innerHTML = siteData.news.map(item => `<li>${item[currentLang]}</li>`).join('');
    }

    function toggleBibtex(id) {
      const el = document.getElementById(id);
      if (el) el.classList.toggle('show-bibtex');
    }

    function renderFeatured(containerId, papers) {
      const container = document.getElementById(containerId);
      container.innerHTML = papers.map((paper, idx) => {
        const id = `${containerId}-${idx}`;
        const links = [];
        if (paper.paperUrl && paper.paperUrl !== '#') links.push(`<a href="${paper.paperUrl}" target="_blank" rel="noreferrer">pdf</a>`);
        if (paper.codeUrl && paper.codeUrl !== '#') links.push(`<a href="${paper.codeUrl}" target="_blank" rel="noreferrer">code</a>`);
        if (Array.isArray(paper.resourceLinks)) {
          paper.resourceLinks.forEach(item => {
            if (item && item.url) links.push(`<a href="${item.url}" target="_blank" rel="noreferrer">${item.label}</a>`);
          });
        }
        links.push(`<button class="link-btn" type="button" onclick="toggleBibtex('${id}')">bibtex</button>`);
        return `
          <article class="paper-card" id="${id}">
            <div class="paper-figure">
              <span class="paper-badge">${paper.badge[currentLang]}</span>
              <img class="paper-thumb" src="${paper.image}" alt="${paper.title.en}" onerror="this.onerror=null;this.src='assets/papers/placeholder.jpg'" />
            </div>
            <div>
              <h4 class="paper-title">${paper.title[currentLang]}</h4>
              <div class="paper-authors">${highlightSelfName(paper.authors[currentLang])}</div>
              <div class="paper-desc">${paper.summary[currentLang]}</div>
              <div class="paper-links">${links.join('<span class="sep">|</span>')}</div>
              <div class="bibtex">${escapeHtml(paper.bibtex || 'xxx')}</div>
            </div>
          </article>
        `;
      }).join('');
    }

    function renderCoauthors() {
      const list = document.getElementById('coauthorList');
      list.innerHTML = siteData.coauthors.map(item => `
        <li>
          <div class="coauthor-line1">
            <span class="venue-badge">${item.venue}</span><a class="coauthor-link" href="${item.url || '#'}" target="_blank" rel="noreferrer" aria-label="paper link">↗</a><span class="coauthor-title">${item.title}.</span> <span class="coauthor-authors">${highlightSelfName(currentLang === 'zh' ? item.authorsZh : item.authorsEn)}</span>
          </div>
        </li>
      `).join('');
    }

    function renderAwards() {
      document.getElementById('awardList').innerHTML = siteData.awards.map(item => `<li>${item[currentLang]}</li>`).join('');
    }

    function renderAll() {
      document.documentElement.lang = currentLang === 'zh' ? 'zh-CN' : 'en';
      document.getElementById('langToggle').textContent = currentLang === 'zh' ? 'English' : '中文';
      createNav();
      renderProfile();
      renderStaticText();
      renderNews();
      renderFeatured('featuredPublished', siteData.featuredPublished);
      renderFeatured('featuredPreprint', siteData.featuredPreprint);
      renderCoauthors();
      renderAwards();
    }

    document.getElementById('langToggle').addEventListener('click', () => {
      currentLang = currentLang === 'zh' ? 'en' : 'zh';
      renderAll();
    });

    renderAll();
  </script>
